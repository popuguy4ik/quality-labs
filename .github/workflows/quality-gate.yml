name: Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # nightly build: каждый день в 6:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

defaults:
  run:
    working-directory: lab5

jobs:
  # === Статический анализ ===
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab5/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # === Юнит-тесты ===
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab5/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lab5/coverage/

  # === E2E-тесты (matrix по браузерам) ===
  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab5/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: lab5/playwright-report/

  # === Lighthouse аудит ===
  lighthouse:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab5/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: lab5/lhci-report/

  # === Сводный отчет ===
  summary:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, e2e-tests, lighthouse]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit: ${{ needs.unit-tests.result }}"
          echo "E2E: ${{ needs.e2e-tests.result }}"
          echo "Lighthouse: ${{ needs.lighthouse.result }}"
          {
            echo "## Quality Gate"
            echo "| Этап | Результат |"
            echo "|---|---|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Unit | ${{ needs.unit-tests.result }} |"
            echo "| E2E | ${{ needs.e2e-tests.result }} |"
            echo "| Lighthouse | ${{ needs.lighthouse.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.e2e-tests.result }}" != "success" ]] || \
             [[ "${{ needs.lighthouse.result }}" != "success" ]]; then
            echo "Quality gate FAILED"
            exit 1
          fi
        working-directory: .

  # === Публикация отчетов на GitHub Pages ===
  deploy-reports:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, lighthouse]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Index page and coverage badge
        working-directory: .
        run: |
          pct=$(python3 -c "import json;print(round(json.load(open('artifacts/coverage/coverage-summary.json'))['total']['lines']['pct']))" 2>/dev/null || echo 0)
          color=$([ "$pct" -ge 80 ] && echo brightgreen || echo orange)
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${pct}%\",\"color\":\"${color}\"}" > artifacts/coverage-badge.json
          {
            echo '<!doctype html><meta charset="utf-8"><title>Отчеты Quality Gate</title><h1>Отчеты Quality Gate</h1><ul>'
            for d in artifacts/*/; do n=$(basename "$d"); echo "<li><a href=\"$n/\">$n</a></li>"; done
            echo "</ul><p>Сборка ${{ github.run_number }}, коммит ${{ github.sha }}</p>"
          } > artifacts/index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts

  # === Nightly: отчет в Issue (GitHub присылает уведомление на почту) ===
  nightly-report:
    runs-on: ubuntu-latest
    needs: [summary]
    if: always() && github.event_name == 'schedule'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const r = '${{ needs.summary.result }}';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build ${new Date().toISOString().slice(0, 10)}: ${r === 'success' ? 'успех' : 'ошибка'}`,
              body: `Результат quality gate: **${r}**\n\nЗапуск: ${url}\nОтчеты: https://${context.repo.owner}.github.io/${context.repo.repo}/`,
            });
