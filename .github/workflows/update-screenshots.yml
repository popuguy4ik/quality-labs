name: Обновить эталонные скриншоты

# Эталоны для визуальных тестов снимаются на той же Ubuntu, что и в CI,
# иначе шрифты и сглаживание отличаются и тесты падают из-за ОС, а не из-за верстки
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab5/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium e2e/visual.spec.ts --update-snapshots
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          git commit -m "Обновить эталонные скриншоты" || echo "Нет изменений"
          git push
